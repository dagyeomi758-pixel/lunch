<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘 뭐 먹지? 🍽️</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
  <style>
    :root {
      --cream: #fff8ec;
      --cream-dark: #fbead0;
      --orange: #ff8a3d;
      --orange-dark: #e8691a;
      --orange-light: #ffe3cc;
      --text: #4a3426;
      --text-soft: #8a6f5c;
      --white: #ffffff;
      --shadow: 0 6px 18px rgba(232, 105, 26, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background: var(--cream);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header .logo {
      font-size: 56px;
      line-height: 1;
      display: inline-block;
      animation: bounce 2.4s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    h1 {
      margin: 8px 0 4px;
      font-size: 28px;
      color: var(--orange-dark);
    }

    header p {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
    }

    .card {
      background: var(--white);
      border-radius: 24px;
      padding: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    /* 선택 조건 묶음 */
    fieldset {
      border: none;
      margin: 0 0 18px;
      padding: 0;
      min-width: 0;
    }

    fieldset:last-of-type {
      margin-bottom: 0;
    }

    legend {
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 10px;
      padding: 0;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip input {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    .chip span {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 44px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid var(--orange-light);
      background: var(--cream);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    }

    .chip span:hover {
      border-color: var(--orange);
    }

    .chip span:active {
      transform: scale(0.96);
    }

    /* 현재 선택된 항목 표시 */
    .chip input:checked + span {
      background: var(--orange);
      border-color: var(--orange);
      color: var(--white);
      box-shadow: 0 3px 8px rgba(255, 138, 61, 0.35);
    }

    .chip input:checked + span::before {
      content: "✓";
      font-weight: 800;
    }

    .chip input:focus-visible + span {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      min-height: 52px;
      padding: 12px 18px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
    }

    button:focus-visible {
      outline: 3px solid var(--orange-dark);
      outline-offset: 2px;
    }

    .btn-primary {
      flex: 1;
      background: var(--orange);
      color: var(--white);
      box-shadow: 0 4px 12px rgba(255, 138, 61, 0.4);
    }

    .btn-primary:hover {
      background: var(--orange-dark);
    }

    .btn-secondary {
      background: var(--white);
      color: var(--orange-dark);
      border: 2px solid var(--orange-light);
    }

    .btn-secondary:hover {
      border-color: var(--orange);
    }

    /* 결과 카드 */
    .result {
      text-align: center;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .result .placeholder-emoji {
      font-size: 48px;
      margin-bottom: 8px;
    }

    .result .message {
      margin: 0;
      color: var(--text-soft);
      font-size: 16px;
      word-break: keep-all;
    }

    .result .message.warn {
      color: var(--orange-dark);
      font-weight: 600;
    }

    .menu-emoji {
      font-size: 80px;
      line-height: 1;
      margin-bottom: 8px;
      animation: pop 0.35s ease-out;
    }

    @keyframes pop {
      0% { transform: scale(0.4); opacity: 0; }
      70% { transform: scale(1.12); opacity: 1; }
      100% { transform: scale(1); }
    }

    .menu-category {
      display: inline-block;
      background: var(--orange-light);
      color: var(--orange-dark);
      font-size: 13px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      margin-bottom: 6px;
    }

    .menu-name {
      margin: 0 0 6px;
      font-size: 26px;
      word-break: keep-all;
    }

    .menu-desc {
      margin: 0 0 14px;
      color: var(--text-soft);
      word-break: keep-all;
    }

    .menu-info {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .menu-info div {
      background: var(--cream);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 15px;
    }

    .menu-info strong {
      color: var(--orange-dark);
    }

    .only-one {
      margin: 4px 0 0;
      color: var(--orange-dark);
      font-weight: 600;
      font-size: 15px;
    }

    .btn-retry {
      margin-top: 14px;
      width: 100%;
      max-width: 260px;
    }

    .notice {
      text-align: center;
      font-size: 13px;
      color: var(--text-soft);
      margin: 0;
      word-break: keep-all;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 380px) {
      h1 { font-size: 24px; }
      .card { padding: 16px; }
      .chip span { padding: 8px 12px; font-size: 14px; }
      .actions { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      header .logo, .menu-emoji { animation: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo" aria-hidden="true">🍽️</div>
      <h1>오늘 뭐 먹지?</h1>
      <p>조건을 고르면 점심 메뉴를 골라 드려요!</p>
    </header>

    <!-- 선택 조건 -->
    <form class="card" id="filterForm" onsubmit="return false;">
      <fieldset>
        <legend>🍱 음식 종류</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="category" value="전체" checked><span>전체</span></label>
          <label class="chip"><input type="radio" name="category" value="한식"><span>한식</span></label>
          <label class="chip"><input type="radio" name="category" value="중식"><span>중식</span></label>
          <label class="chip"><input type="radio" name="category" value="일식"><span>일식</span></label>
          <label class="chip"><input type="radio" name="category" value="양식"><span>양식</span></label>
          <label class="chip"><input type="radio" name="category" value="분식"><span>분식</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>💰 최대 예산</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="budget" value="0" checked><span>제한 없음</span></label>
          <label class="chip"><input type="radio" name="budget" value="8000"><span>8,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="10000"><span>10,000원</span></label>
          <label class="chip"><input type="radio" name="budget" value="15000"><span>15,000원</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend>🌶️ 매운 정도</legend>
        <div class="chips">
          <label class="chip"><input type="radio" name="spicy" value="any" checked><span>상관없음</span></label>
          <label class="chip"><input type="radio" name="spicy" value="0"><span>안 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="1"><span>살짝 매운 음식</span></label>
          <label class="chip"><input type="radio" name="spicy" value="2"><span>매운 음식</span></label>
        </div>
      </fieldset>
    </form>

    <div class="actions">
      <button type="button" class="btn-primary" id="recommendBtn">점심 메뉴 추천받기</button>
      <button type="button" class="btn-secondary" id="resetBtn">조건 초기화</button>
    </div>

    <!-- 추천 결과 -->
    <section class="card result" id="result" aria-live="polite"></section>

    <p class="notice">※ 가격은 실습용 예시 금액이며 실제 식당 가격과 다를 수 있어요.</p>
  </div>

  <script>
    /* =========================================================
       🍚 메뉴 목록 (학생들이 메뉴를 추가하거나 수정하는 곳)
       ---------------------------------------------------------
       메뉴 하나는 { } 한 묶음이에요. 아래 형식대로 줄을 추가하거나
       값을 바꾸면 앱에 바로 반영돼요.

       name     : 메뉴 이름
       category : 음식 종류 → "한식", "중식", "일식", "양식", "분식" 중 하나
       emoji    : 음식 이모지
       desc     : 짧은 설명
       price    : 예상 가격 (숫자만, 쉼표 없이 예: 9000)
       spicy    : 매운 정도 → 0 = 안 매움, 1 = 살짝 매움, 2 = 매움

       ✏️ 새 메뉴 추가 예시 (맨 앞의 // 를 지우고 목록 안에 넣어 보세요)
       // { name: "제육덮밥", category: "한식", emoji: "🍛", desc: "매콤달콤 돼지고기 덮밥", price: 8500, spicy: 1 },
       ========================================================= */
    const MENUS = [
      // ----- 한식 -----
      { name: "김치찌개",     category: "한식", emoji: "🍲", desc: "푹 익은 김치와 돼지고기가 들어간 얼큰한 찌개", price: 9000,  spicy: 2 },
      { name: "된장찌개",     category: "한식", emoji: "🥘", desc: "구수한 된장에 두부와 애호박이 듬뿍",           price: 8000,  spicy: 0 },
      { name: "비빔밥",       category: "한식", emoji: "🍚", desc: "갖은 나물과 고추장을 쓱쓱 비벼 먹는 한 그릇",  price: 9500,  spicy: 1 },
      { name: "불고기 정식",  category: "한식", emoji: "🥩", desc: "달콤한 간장 양념 불고기와 반찬 한 상",         price: 13000, spicy: 0 },
      { name: "삼계탕",       category: "한식", emoji: "🐔", desc: "인삼과 찹쌀을 넣고 푹 고은 보양식",            price: 17000, spicy: 0 },
      { name: "닭갈비",       category: "한식", emoji: "🍗", desc: "양배추와 떡을 넣고 볶은 매콤한 닭갈비",        price: 14000, spicy: 2 },

      // ----- 중식 -----
      { name: "짜장면",       category: "중식", emoji: "🍜", desc: "달콤 짭짤한 춘장 소스의 국민 면 요리",          price: 7000,  spicy: 0 },
      { name: "짬뽕",         category: "중식", emoji: "🌶️", desc: "해물 가득 얼큰한 빨간 국물 면",               price: 9000,  spicy: 2 },
      { name: "볶음밥",       category: "중식", emoji: "🍳", desc: "불맛 나는 고슬고슬 계란 볶음밥",               price: 8000,  spicy: 0 },
      { name: "마파두부밥",   category: "중식", emoji: "🍛", desc: "부드러운 두부와 얼얼한 소스를 밥 위에",        price: 9500,  spicy: 1 },
      { name: "탕수육 세트",  category: "중식", emoji: "🍖", desc: "바삭한 탕수육과 짜장면이 함께 나오는 세트",    price: 16000, spicy: 0 },
      { name: "마라탕",       category: "중식", emoji: "🥵", desc: "얼얼하고 매운 국물에 좋아하는 재료를 쏙쏙",    price: 12000, spicy: 2 },

      // ----- 일식 -----
      { name: "돈가스",       category: "일식", emoji: "🍱", desc: "겉은 바삭 속은 촉촉한 두툼한 돈가스",          price: 10000, spicy: 0 },
      { name: "초밥 세트",    category: "일식", emoji: "🍣", desc: "신선한 생선을 올린 초밥 모둠",                 price: 18000, spicy: 0 },
      { name: "라멘",         category: "일식", emoji: "🍜", desc: "진한 돼지뼈 육수에 차슈를 올린 라멘",          price: 11000, spicy: 0 },
      { name: "규동",         category: "일식", emoji: "🥢", desc: "달짝지근한 소고기를 밥 위에 올린 덮밥",        price: 8000,  spicy: 0 },
      { name: "매운 카레우동", category: "일식", emoji: "🍲", desc: "쫄깃한 우동 면에 매콤한 카레 국물",           price: 9500,  spicy: 1 },
      { name: "탄탄멘",       category: "일식", emoji: "🔥", desc: "고소한 깨 소스와 고추기름의 매운 라멘",        price: 12000, spicy: 2 },

      // ----- 양식 -----
      { name: "토마토 파스타", category: "양식", emoji: "🍝", desc: "새콤한 토마토 소스의 기본 파스타",            price: 13000, spicy: 0 },
      { name: "크림 리조또",  category: "양식", emoji: "🥣", desc: "버섯과 크림으로 부드럽게 끓인 리조또",         price: 14000, spicy: 0 },
      { name: "햄버거 세트",  category: "양식", emoji: "🍔", desc: "두툼한 패티 버거와 감자튀김, 음료",            price: 9000,  spicy: 0 },
      { name: "아라비아따",   category: "양식", emoji: "🌶️", desc: "페페론치노로 매콤하게 맛을 낸 토마토 파스타", price: 14000, spicy: 2 },
      { name: "치킨 샐러드",  category: "양식", emoji: "🥗", desc: "구운 닭가슴살을 올린 산뜻한 샐러드",           price: 11000, spicy: 0 },
      { name: "스테이크",     category: "양식", emoji: "🥩", desc: "육즙 가득 구운 소고기 스테이크",               price: 25000, spicy: 0 },
      { name: "멕시칸 부리또", category: "양식", emoji: "🌯", desc: "매콤한 살사와 고기, 밥을 또띠아에 쏙",        price: 10000, spicy: 1 },

      // ----- 분식 -----
      { name: "떡볶이",       category: "분식", emoji: "🍢", desc: "쫄깃한 떡에 매콤달콤 고추장 양념",             price: 5000,  spicy: 1 },
      { name: "김밥",         category: "분식", emoji: "🍙", desc: "알록달록 재료를 말아 든든한 한 줄",            price: 4000,  spicy: 0 },
      { name: "라볶이",       category: "분식", emoji: "🍜", desc: "라면과 떡볶이를 함께 즐기는 메뉴",             price: 6500,  spicy: 1 },
      { name: "엽기 떡볶이",  category: "분식", emoji: "🔥", desc: "땀 나게 매운 도전용 떡볶이",                   price: 14000, spicy: 2 },
      { name: "쫄면",         category: "분식", emoji: "🥗", desc: "탱탱한 면에 새콤매콤 양념과 채소",             price: 7000,  spicy: 2 },
      { name: "돈가스 김밥 세트", category: "분식", emoji: "🍱", desc: "돈가스 김밥에 우동 한 그릇까지",          price: 9000,  spicy: 0 }
    ];
    /* ===================== 메뉴 목록 끝 ===================== */

    // 매운 정도 숫자를 화면에 보여줄 글자로 바꿔요.
    const SPICY_LABELS = {
      0: "안 매움 😊",
      1: "살짝 매움 🌶️",
      2: "매움 🌶️🌶️🌶️"
    };

    const form = document.getElementById("filterForm");
    const resultEl = document.getElementById("result");
    const recommendBtn = document.getElementById("recommendBtn");
    const resetBtn = document.getElementById("resetBtn");

    let lastMenu = null;        // 직전에 추천한 메뉴
    let hasShownResult = false; // 결과나 안내를 한 번이라도 보여줬는지

    // 지금 선택된 조건 읽기
    function getFilters() {
      return {
        category: form.elements.category.value,
        budget: Number(form.elements.budget.value),
        spicy: form.elements.spicy.value
      };
    }

    // 선택한 조건을 모두 만족하는 메뉴만 골라내기
    function getMatchingMenus() {
      const f = getFilters();
      return MENUS.filter(function (menu) {
        const categoryOk = f.category === "전체" || menu.category === f.category;
        const budgetOk = f.budget === 0 || menu.price <= f.budget;
        const spicyOk = f.spicy === "any" || menu.spicy === Number(f.spicy);
        return categoryOk && budgetOk && spicyOk;
      });
    }

    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function formatPrice(price) {
      return price.toLocaleString("ko-KR") + "원";
    }

    // 글자를 안전하게 화면에 넣기 위한 도우미
    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text);
      return div.innerHTML;
    }

    function showMessage(emoji, text, isWarn) {
      resultEl.innerHTML =
        '<div class="placeholder-emoji" aria-hidden="true">' + emoji + '</div>' +
        '<p class="message' + (isWarn ? ' warn' : '') + '">' + escapeHtml(text) + '</p>';
    }

    function showInitial() {
      showMessage("🤔", "조건을 고르고 ‘점심 메뉴 추천받기’를 눌러 보세요!", false);
    }

    function showMenu(menu, isOnlyOne) {
      resultEl.innerHTML =
        '<div class="menu-emoji" aria-hidden="true">' + escapeHtml(menu.emoji) + '</div>' +
        '<span class="menu-category">' + escapeHtml(menu.category) + '</span>' +
        '<h2 class="menu-name">' + escapeHtml(menu.name) + '</h2>' +
        '<p class="menu-desc">' + escapeHtml(menu.desc) + '</p>' +
        '<div class="menu-info">' +
          '<div>💰 예상 가격 <strong>' + formatPrice(menu.price) + '</strong></div>' +
          '<div>🔥 매운 정도 <strong>' + (SPICY_LABELS[menu.spicy] || "-") + '</strong></div>' +
        '</div>' +
        (isOnlyOne ? '<p class="only-one">조건에 맞는 메뉴가 하나예요.</p>' : '') +
        '<button type="button" class="btn-secondary btn-retry" id="retryBtn">🔄 다시 추천</button>';

      document.getElementById("retryBtn").addEventListener("click", function () {
        recommend(true);
      });
    }

    // 메뉴 추천하기 (excludeLast가 true면 직전 메뉴는 빼고 골라요)
    function recommend(excludeLast) {
      const matches = getMatchingMenus();
      hasShownResult = true;

      if (matches.length === 0) {
        lastMenu = null;
        showMessage("😢", "조건에 맞는 메뉴가 없어요. 예산이나 다른 조건을 바꿔보세요.", true);
        return;
      }

      if (matches.length === 1) {
        lastMenu = matches[0];
        showMenu(lastMenu, true);
        return;
      }

      let candidates = matches;
      if (excludeLast && lastMenu) {
        candidates = matches.filter(function (menu) { return menu !== lastMenu; });
      }

      lastMenu = pickRandom(candidates);
      showMenu(lastMenu, false);
    }

    recommendBtn.addEventListener("click", function () {
      recommend(false);
    });

    // 조건이 바뀌면 이전 결과 대신 안내 문구 보여주기
    form.addEventListener("change", function () {
      lastMenu = null;
      if (hasShownResult) {
        showMessage("✨", "조건이 바뀌었어요. 다시 추천받아 보세요.", false);
      }
    });

    // 조건 초기화: 기본 선택으로 되돌리기
    resetBtn.addEventListener("click", function () {
      form.reset();
      lastMenu = null;
      hasShownResult = false;
      showInitial();
    });

    showInitial();
  </script>
</body>
</html>
